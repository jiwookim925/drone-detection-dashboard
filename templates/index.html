<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>산악 구조 드론 탐지 기록</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
    <header class="topbar">
        <div>
            <p class="eyebrow">MOUNTAIN RESCUE SYSTEM</p>
            <h1>드론 탐지 기록 대시보드</h1>
            <p class="subtitle">사람 탐지 위치와 신뢰도를 기록하고 확인합니다.</p>
        </div>
        <div class="server-badge">
            <span class="status-dot"></span>
            Flask API
        </div>
    </header>

    <main class="container">
        <section class="summary-grid">
            <article class="summary-card">
                <span>전체 탐지</span>
                <strong id="total-count">0</strong>
            </article>
            <article class="summary-card">
                <span>미확인</span>
                <strong id="unverified-count">0</strong>
            </article>
            <article class="summary-card">
                <span>실제 사람</span>
                <strong id="confirmed-count">0</strong>
            </article>
            <article class="summary-card">
                <span>오탐</span>
                <strong id="false-positive-count">0</strong>
            </article>
        </section>

        <div class="tab-bar" role="tablist">
            <button class="tab-button active" type="button" data-tab="live">실시간 감지</button>
            <button class="tab-button" type="button" data-tab="search">탐지 기록 검색</button>
            <button class="tab-button" type="button" data-tab="register">탐지 기록 등록</button>
        </div>

        <section class="panel tab-panel" data-tab-panel="live">
            <div class="panel-heading">
                <div>
                    <p class="section-label">LIVE FEED</p>
                    <h2>실시간 감지</h2>
                </div>
                <div class="connection-badge" id="connection-badge">
                    <span class="status-dot dot-off"></span>
                    <span id="connection-label">연결 안 함</span>
                </div>
            </div>

            <div id="live-feed" class="detection-list">
                <p class="empty-message">실시간으로 들어오는 탐지 기록이 여기에 표시됩니다.</p>
            </div>
        </section>

        <section class="panel tab-panel" data-tab-panel="search" hidden>
            <div class="panel-heading">
                <div>
                    <p class="section-label">DETECTION LOG</p>
                    <h2>최근 탐지 기록</h2>
                </div>
                <button id="refresh-button" class="secondary-button" type="button">
                    새로고침
                </button>
            </div>

            <div class="filter-bar">
                <label class="filter-search">
                    검색
                    <input id="search-input" type="text" placeholder="탐지 ID로 검색">
                </label>

                <label>
                    상태
                    <select id="status-filter">
                        <option value="">전체</option>
                        <option value="unverified">미확인</option>
                        <option value="checking">확인 중</option>
                        <option value="confirmed">실제 사람</option>
                        <option value="false_positive">오탐</option>
                        <option value="resolved">구조 완료</option>
                    </select>
                </label>

                <label>
                    날짜
                    <input id="date-filter" type="date">
                </label>

                <label>
                    시각
                    <input id="time-filter" type="text" inputmode="numeric"
                           placeholder="HH:MM 또는 HH:MM:SS" maxlength="8">
                </label>
            </div>

            <div id="detection-list" class="detection-list">
                <p class="empty-message">탐지 기록을 불러오는 중입니다.</p>
            </div>
        </section>

        <section class="panel tab-panel" data-tab-panel="register" hidden>
            <div class="panel-heading">
                <div>
                    <p class="section-label">NEW DETECTION</p>
                    <h2>탐지 기록 등록</h2>
                </div>
                <p>현재는 사람이 입력하고, 나중에는 ROS2가 같은 API로 전송합니다.</p>
            </div>

            <form id="detection-form" class="detection-form">
                <label>
                    탐지 시각
                    <input id="detected-at" type="datetime-local" required>
                </label>

                <label>
                    위도
                    <input id="latitude" type="number" step="any" min="-90" max="90"
                           placeholder="37.2991" required>
                </label>

                <label>
                    경도
                    <input id="longitude" type="number" step="any" min="-180" max="180"
                           placeholder="127.0342" required>
                </label>

                <label>
                    고도(m)
                    <input id="altitude" type="number" step="0.1"
                           placeholder="85.4" required>
                </label>

                <label>
                    탐지 인원
                    <input id="person-count" type="number" min="1" value="1" required>
                </label>

                <label>
                    신뢰도
                    <input id="confidence" type="number" step="0.01" min="0" max="1"
                           placeholder="0.87" required>
                </label>

                <button type="submit" class="primary-button">탐지 기록 저장</button>
            </form>

            <p id="form-message" class="message" aria-live="polite"></p>
        </section>
    </main>
</body>
</html>
